# env var
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/windowrule.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/startup.conf

# monitors
monitor = DP-3, 1920x1080@60, 0x1080, 1
monitor = DP-2, 1920x1080@60, 1920x0, 1
monitor = HDMI-A-1, 1920x1080@74.97300, 1920x1080, 1

# assign workspaces to specific monitor
workspace {
	workspace = 1, monitor:HDMI-A-1
	workspace = 2, monitor:DP-3
	workspace = 3, monitor:HDMI-A-1
	workspace = 4, monitor:DP-3
	workspace = 5, monitor:DP-3
	workspace = 6, monitor:DP-3
	workspace = 7, monitor:HDMI-A-1
	workspace = 8, monitor:HDMI-A-1
	workspace = 9, monitor:HDMI-A-1
}

# input
input {
  # XKB layout
  kb_layout = us,cz
	kb_variant = ,qwerty
	kb_options=grp:alt_shift_toggle,caps:swapescape

  # swap esacpe with capslock
	# kb_options = caps:swapescape
  follow_mouse = 1
  # kb_model = cherryblue # XKB model
  # kb_variant = dvorak # XKB variant
  numlock_by_default = true
  # repeat_rate = 25
  # repeat_delay = 600
  # natural_scroll = true
  # force_no_accel = 0
  accel_profile = flat
}


# general
general {
  gaps_in = 8
  gaps_out = 10
  border_size = 2
  col.active_border = 0xff6A3837
  col.inactive_border = 0xff2A2B2C
  no_border_on_floating = false # enable border on float window
  layout = dwindle
  # cursor_inactive_timeout = 0
  # no_focus_fallback = false
  # resize_on_border = false
}

device {
	name = razer-razer-mamba-elite
  sensitivity = -0.35
}

device {
	name = kensington-slimblade-trackball
  sensitivity = -0.25
}

# misc
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  vfr = true
  vrr = 0
  animate_manual_resizes = true
  mouse_move_focuses_monitor = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}

# decoration
decoration {

  # round corners
  rounding = 0
  # multisample_edges = true

  # opacity
  active_opacity = 1.0
  inactive_opacity = 1.0

 # blur
 blur {
  enabled = false
  size = 6
  passes = 3
  new_optimizations = true
  xray = true
  ignore_opacity = true
  }

	shadow {
		enabled = false
		ignore_window = true
		offset = 1 2
		range = 10
		render_power = 5
	}

  #blurls = gtk-layer-shell
  blurls = waybar
  blurls = lockscreen
}

# animations
animations {
  enabled = true

  # bezier curve
  bezier = wind, 0.05, 0.9, 0.1, 1
  bezier = winIn, 0.1, 1.1, 0.1, 1
  bezier = winOut, 0.1, -0.1, 0.1, 1
  bezier = liner, 1, 1, 1, 1

  # animation
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 5, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = borderangle, 1, 30, liner, loop
  animation = fade, 1, 10, default
  animation = workspaces, 1, 5, wind
}

# layouts

dwindle {
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

binds {
	allow_workspace_cycles = true
}
